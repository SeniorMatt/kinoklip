<div class="ill" aria-hidden="true" style="display:grid;gap:12px">
<div class="a-line vim-row" style="--i:0"><span class="keycap">5l</span><span class="muted">step five frames</span></div>

<div class="a-line vim-row" style="--i:5"><span class="keycap">u</span><span class="muted">undo</span></div>
</div>
