name: Idea or feature request
description: Suggest something new or a better way to do something.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A short description is enough.
  - type: input
    id: version
    attributes:
      label: Kinoklip version
      placeholder: "1.1.2-beta.1"
    validations:
      required: false
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Kinoklip to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help you with?
    validations:
      required: false
