<!-- Kinoklip application icon: a film frame with sprocket holes and a geometric "K" whose
     upper arm is a slanted clapper stick. Original artwork, flat shapes only. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3550"/>
      <stop offset="1" stop-color="#171c2b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82d6"/>
      <stop offset="1" stop-color="#1f4f9a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a2f"/>
    </linearGradient>
  </defs>

  <!-- film frame -->
  <rect x="16" y="16" width="224" height="224" rx="40" fill="url(#frame)"/>

  <!-- sprocket holes, left and right -->
  <g fill="#0e121c">
    <rect x="28" y="44" width="18" height="22" rx="5"/>
    <rect x="28" y="88" width="18" height="22" rx="5"/>
    <rect x="28" y="132" width="18" height="22" rx="5"/>
    <rect x="28" y="176" width="18" height="22" rx="5"/>
    <rect x="210" y="44" width="18" height="22" rx="5"/>
    <rect x="210" y="88" width="18" height="22" rx="5"/>
    <rect x="210" y="132" width="18" height="22" rx="5"/>
    <rect x="210" y="176" width="18" height="22" rx="5"/>
  </g>

  <!-- picture area -->
  <rect x="58" y="36" width="140" height="184" rx="14" fill="url(#screen)"/>

  <!-- the K: stem, clapper-stick upper arm (with stripes), lower leg -->
  <rect x="80" y="62" width="30" height="132" rx="6" fill="#ffffff"/>
  <g transform="rotate(-38 110 128)">
    <rect x="108" y="113" width="86" height="28" rx="6" fill="url(#accent)"/>
    <g fill="#1d2433">
      <polygon points="126,113 140,113 130,141 116,141"/>
      <polygon points="154,113 168,113 158,141 144,141"/>
      <polygon points="182,113 194,113 194,121 186,141 172,141"/>
    </g>
  </g>
  <polygon points="112,136 136,120 180,194 150,194" fill="#ffffff"/>
</svg>
